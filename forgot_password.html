<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
</head>

<style>
    body {font-family: Helvetica}
    .form {width: 400px;}
    .form-row {display: flex; margin-bottom: 15px;}
    .form-row label {width: 150px;}
    .form-row input {width: 200px;}
</style>

<body>
    <h1> Forgot Password? </h1>
    <p> Enter your registered email address below. </p>
    <style>
        body {
            font-family: Helvetica;
            color: rgb(40, 4, 4);
            background-color: rgb(251, 251, 239);
            font-size: 16px;
        }

        h1 {
            color: rgb(0, 0, 0);
        }

        .form {
            width: 280px;
        }

        .form-row {
            position: relative;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        /* Hide text labels so the input stays rounded */
        .form-row label {
            display: none;
        }

        /* Email input styling */
        #forgot_email {
            width: 100%;
            height: 44px;
            padding-left: 48px;
            padding-right: 16px;
            border-radius: 50px;
            border: 1px solid #c4beb4;
            background-color: #dcdcdc;
            color: #333333;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            background-repeat: no-repeat;
            background-position: 16px center;
            background-size: 18px 18px;

            /* Email icon */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238c6d58"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>');
        }

        #forgot_email:focus {
            border-color: #8c6d58;
        }

        /* Button styling */
        #forgot_password_button {
            background-color: #221e1e;
            color: #dcdcdc;
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            font-family: sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        #forgot_password_button:hover {
            background-color: #51413a;
        }

        #forgot_password_button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Status message */
        #forgot_message {
            font-size: 13px;
            color: #8c4038;
        }

        /* Back to Login link */
        .back-link a {
            color: #8c6d58;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>

    <div class="form">
        <div class="form-row">
            <label for="forgot_email">Email</label>
            <input
                type="email"
                id="forgot_email"
                placeholder="Enter your email"
                required
            >
        </div>
    </div>

    <br><br>

    <button id="forgot_password_button">
        Send Reset Link
    </button>

    <p id="forgot_message" role="status"></p>

    <p class="back-link">
        <a href="./login.html">Back to Login</a>
    </p>
</body>

<script type="module">
    import PocketBase from'https://cdn.jsdelivr.net/npm/pocketbase@0.28.0/+esm';
    const pb = new PocketBase('http://127.0.0.1:8090');

    var email = document.getElementById("forgot_email");
    var message = document.getElementById("forgot_message");
    var button = document.getElementById("forgot_password_button");

    // Send the password-reset email
    button.onclick = async () => {
        let userEmail = email.value.trim();
        
        // Check whether the email is empty
        if (!userEmail) {
            message.textContent = "Please enter your email address.";
            return;
        }

        // Check whether the email format is valid
        if (!email.checkValidity()) {
            message.textContent = "Please enter a valid email address.";
            return;
        }

        // DO I NEED THIS? 
        button.disabled = true;
        button.textContent = "Sending...";
        message.textContent = "";

        try {
            // Send the password-reset email
            await pb.collection("users").requestPasswordReset(userEmail);

            message.textContent =
                "If an account exists for this email, a reset link will be sent. Please check your inbox and spam folder.";

        } catch (error) {
            console.error("Forgot password error:", error);
            console.error("HTTP status:", error.status);

            console.error(
                "PocketBase response:",
                JSON.stringify(error.response, null, 2)
            );

            message.textContent =
                error.response?.message || error.message;
        }
    }

</script>

</html>
