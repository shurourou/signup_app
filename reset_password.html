<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
body {font-family: Helvetica}
.form {width: 400px;}
.form-row {display: flex; margin-bottom: 15px;}
.form-row label {width: 150px;}
.form-row input {width: 200px;}           
</style>

<body>
    <h1>Reset Password</h1>
    <p>Enter your new password below.</p>
    <style>
        body {
            font-family: Helvetica;
            color: rgb(40, 4, 4);
            background-color: rgb(251, 251, 239);
            font-size: 16px;
        }

        h1 {
            color: rgb(0, 0, 0);
        }

        .form {
            width: 280px;
        }

        .form-row {
            position: relative;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        /* Hide labels to match the rounded input design */
        .form-row label {
            display: none;
        }

        /* Password input styling */
        #new_password,
        #confirm_new_password {
            width: 100%;
            height: 44px;
            padding-left: 48px;
            padding-right: 42px;
            border-radius: 50px;
            border: 1px solid #c4beb4;
            background-color: #dcdcdc;
            color: #333333;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            background-repeat: no-repeat;
            background-position: 16px center;
            background-size: 18px 18px;

            /* Brown key icon */
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238c6d58'><path d='M12.65 10C11.7 7.31 9.08 5.5 6 5.5c-3.58 0-6.5 2.92-6.5 6.5s2.92 6.5 6.5 6.5c3.08 0 5.7-1.81 6.65-4.5H17v3h3v-3h2v-4H12.65zM6 15c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z'/></svg>");
        }

        #new_password:focus,
        #confirm_new_password:focus {
            border-color: #8c6d58;
        }

        /* Eye icons */
        #new_password_eye_button,
        #confirm_password_eye_button {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #new_password_eye_button svg,
        #confirm_password_eye_button svg {
            width: 80%;
            height: 80%;
            fill: #8c6d58;
        }

        /* Reset button */
        #reset_password_button {
            background-color: #221e1e;
            color: #dcdcdc;
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            font-family: sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        #reset_password_button:hover {
            background-color: #51413a;
        }

        #reset_password_button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #reset_message {
            font-size: 13px;
            color: #8c4038;
            line-height: 1.5;
        }

        .back-link {
            font-size: 14px;
        }

        .back-link a {
            color: #8c6d58;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>

    <div class="form">

        <div class="form-row">
            <label for="new_password">New Password</label>

            <input
                type="password"
                id="new_password"
                placeholder="New Password"
                autocomplete="new-password"
                required
            >

            <span id="new_password_eye_button">
                <svg viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </span>
        </div>

        <div class="form-row">
            <label for="confirm_new_password">
                Confirm New Password
            </label>

            <input
                type="password"
                id="confirm_new_password"
                placeholder="Confirm New Password"
                autocomplete="new-password"
                required
            >

            <span id="confirm_password_eye_button">
                <svg viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </span>
        </div>

    </div>

    <p id="reset_message" role="status"></p>

    <br><br>

    <button id="reset_password_button">
        Reset Password
    </button>

    <p class="back-link">
        <a href="./login.html">Back to Login</a>
    </p>

</body>

<script>
    // Show or hide the new password
    var password = document.getElementById("new_password");

    document.getElementById("new_password_eye_button").onclick = () => {
        if (password.type == "text") {
            password.type = "password";
        } else {
            password.type = "text";
        }
    };

    // Show or hide the confirmed password
    var confirm_password =
        document.getElementById("confirm_new_password");

    document.getElementById("confirm_password_eye_button").onclick = () => {
        if (confirm_password.type == "text") {
            confirm_password.type = "password";
        } else {
            confirm_password.type = "text";
        }
    };
</script>

<script type="module">
    import PocketBase from
        'https://cdn.jsdelivr.net/npm/pocketbase@0.28.0/+esm';

    const pb = new PocketBase('http://127.0.0.1:8090');

    const password = document.getElementById("new_password");
    const confirmPassword =
        document.getElementById("confirm_new_password");

    const message = document.getElementById("reset_message");
    const resetButton =
        document.getElementById("reset_password_button");

    // Get the reset token from the email link
    const token = new URLSearchParams(
        window.location.search
    ).get("token");

    // Reset password when the button is clicked
    resetButton.onclick = async () => {

        if (!token) {
            message.textContent =
                "Reset link is missing or invalid. Please request a new one.";
            return;
        }

        if (!password.value || !confirmPassword.value) {
            message.textContent = "Please fill in both password fields.";
            return;
        }

        if (password.value !== confirmPassword.value) {
            message.textContent = "Passwords do not match.";
            return;
        }

        resetButton.disabled = true;
        resetButton.textContent = "Resetting...";
        message.textContent = "";

        try {
            await pb.collection("users").confirmPasswordReset(
                token,
                password.value,
                confirmPassword.value
            );

            alert("Password reset successful!");

            window.location.href = "./login.html";

        } catch (error) {
            console.error("Password reset failed:", error);

            message.textContent =
                "Password reset failed. The link may have expired or is invalid. Please request a new one.";

        } finally {
            resetButton.disabled = false;
            resetButton.textContent = "Reset Password";
        }
    };
</script>

</html>
