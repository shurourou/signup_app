<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
body {font-family: Helvetica}
.form {width: 400px;}
.form-row {display: flex; margin-bottom: 15px;}
.form-row label {width: 150px;}
.form-row input {width: 200px;}           
</style>

<body>
    <h1> Sign Up </h1>
    <style>
        body {font-family: Helvetica; color:rgb(40, 4, 4); background-color: rgb(251, 251, 239); font-size: 16px;}
        h1 {color:rgb(0, 0, 0)}

        .form {width: 280px;}
        
        .form-row {
            position: relative;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        } 
    
        /* Hide text labels so inputs stay clean and rounded */
        .form-row label {
            display: none;
         }

        /* Base Styling for Inputs */
        #signup_email,
        #signup_password,
        #confirm_password {
            width: 100%;
            height: 44px;
            padding-left: 48px;
            padding-right: 42px;
            border-radius: 50px;
            border: 1px solid #c4beb4;
            background-color: #dcdcdc;
            color: #333333;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            background-repeat: no-repeat;
            background-position: 16px center;
            background-size: 18px 18px;
        }

        /* Email Input - Mail Icon */
        #signup_email {
            padding-right: 16px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238c6d58"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>');
        }

        /* Password Inputs - Key Icons */
        #signup_password,
        #confirm_password {
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%238c6d58"><path d="M12.65 10C11.7 7.31 9.08 5.5 6 5.5c-3.58 0-6.5 2.92-6.5 6.5s2.92 6.5 6.5 6.5c3.08 0 5.7-1.81 6.65-4.5H17v3h3v-3h2v-4H12.65zM6 15c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3-1.34-3-3-3z"/></svg>');
        }

        /* Eye Buttons Styling */
        #signup_eye_button,
        #confirm_eye_button {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #signup_eye_button svg,
        #confirm_eye_button svg {
            width: 80%;
            height: 80%;
            fill: #8c6d58;
        }

        /* Button Styling */
        #signup_button {
            background-color: #221e1e;
            color: #dcdcdc;
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            font-family: sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .password-message {
            font-size: 12px;
            color: #8c4038;
            margin: -8px 0 15px 8px;
        }

        /* Hide the message space when there is no message */
        .password-message:empty {
            display: none;
        }

        .password-message.valid {
            color: #507653;
        }

        /* Fix Browser Autofill Light-Blue Background */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #dcdcdc inset !important;
            -webkit-text-fill-color: #333333 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        </style>

    <div class="form">
        <div class="form-row">
            <label for="email">Email</label> 
            <input type="email" id="signup_email">
        </div>

        <div class="form-row">   
            <label for="password">Password</label> 
            <input type="password" id="signup_password">
            <span id="signup_eye_button">
                <svg viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </span>
        </div>
       
        <p id="password_message" class="password-message"></p>

        <div class="form-row">   
            <label for="confirm_password">Confirm password</label>
            <input type="password" id="confirm_password">
            <span id="confirm_eye_button">
                <svg viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </span>
        </div>

        <p id="confirm_message" class="password-message"></p>
        
    </div>
    
    <br><br>
        <button type="button" id="signup_button">Sign up</button>
</body>

<script>
    ///# password button: show or hide the password
    var password = document.getElementById("signup_password")
    var username = null
    document.getElementById("signup_eye_button").onclick = () => {
    if (password.type == "text") {
        password.type = "password"
    } else {
        password.type = "text"
    }
    }
    
    ///# make the password minimum length message appear while typing
    var passwordMessage = document.getElementById("password_message");

    password.addEventListener("input", () => {
        if (password.value.length === 0) {
            passwordMessage.textContent = "";
            passwordMessage.classList.remove("valid");
        } else if (password.value.length < 8) {
            passwordMessage.textContent =
                "Password must be at least 8 characters.";
            passwordMessage.classList.remove("valid");
        } else {
            passwordMessage.textContent = "Password length looks good!";
            passwordMessage.classList.add("valid");
        }
    });
    
    ///#confirm password button:show or hide the password 
    var confirm_password = document.getElementById("confirm_password")
    document.getElementById("confirm_eye_button").onclick = () => {
    if (confirm_password.type == "text") {
        confirm_password.type = "password"
    } else {
        confirm_password.type = "text"
    }
    }
   
    //# check if password & confirm password match 
    var signupPassword = document.getElementById("signup_password");
    var confirmPasswordInput = document.getElementById("confirm_password");
    var confirmMessage = document.getElementById("confirm_message");

    function checkPasswordMatch() {
        if (confirmPasswordInput.value === "") {
            confirmMessage.textContent = "";
        } else if (signupPassword.value !== confirmPasswordInput.value) {
            confirmMessage.textContent = "Passwords do not match.";
        } else {
            confirmMessage.textContent = "";
        }
    }

    signupPassword.addEventListener("input", checkPasswordMatch);
    confirmPasswordInput.addEventListener("input", checkPasswordMatch);
</script>

<script src="pocket_base.js" type="module"> 
</script>
