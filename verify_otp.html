<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
body {font-family: Helvetica}
.form {width: 400px;}
.form-row {display: flex; margin-bottom: 15px;}
.form-row label {width: 150px;}
.form-row input {width: 200px;}           
</style>

<html>
<body>
    <h1> Verify Email </h1>

    <style>
        body {font-family: Helvetica; color:rgb(40, 4, 4); background-color: rgb(251, 251, 239); font-size: 16px;}
        h1 {color:rgb(0, 0, 0)}

        .form {width: 280px;}

        .form-row {
            position: relative;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .form-row label {
            display: none;
        }

        /* OTP Input */
        #otp_code {
            width: 100%;
            height: 44px;
            padding-left: 16px;
            padding-right: 16px;
            border-radius: 50px;
            border: 1px solid #c4beb4;
            background-color: #dcdcdc;
            color: #333333;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        /* Button Styling */
        #verify_otp_button,
        #resend_otp_button {
            background-color: #221e1e;
            color: #dcdcdc;
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            font-family: sans-serif;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
    </style>

    <p>Please enter the verification code sent to your email.</p>

    <div class="form">
        <div class="form-row">
            <label for="otp_code">Verification Code</label>
            <input
                type="text"
                id="otp_code"
                placeholder="Enter verification code"
                inputmode="numeric"
                autocomplete="one-time-code"
            >
        </div>
    </div>

    <br><br>

    <button id="verify_otp_button"> Verify Email </button>
    &nbsp;
    <button id="resend_otp_button"> Resend OTP </button>

    <script src="./pocket_base.js" type="module"></script>
</body>
</html>
